services:
  jellyfin:
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    group_add:
      - "44" #video group
      - "107" #render group
    devices:
      - /dev/dri:/dev/dri
    image: ghcr.io/jellyfin/jellyfin:12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
    ports:
      - 1900:1900/udp
      - 7359:7359/udp
      - 8096:8096/tcp
      - 8920:8920/tcp
    environment:
      - JELLYFIN_DATA_DIR=/config/data
      - JELLYFIN_CONFIG_DIR=/config
      - JELLYFIN_LOG_DIR=/config/log
      - JELLYFIN_CACHE_DIR=/config/cache
      - TZ=${TZ}
    volumes:
      - ${APPDATA_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media


  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    user: "${PUID}:${PGID}"
    ports:
      - 5055:5055/tcp
    restart: unless-stopped

    volumes:
      - ${APPDATA_ROOT}/seerr:/app/config
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info

  profilarr:
    container_name: profilarr
    image: ghcr.io/santiagosayshey/profilarr:latest@sha256:5c7203b8af08ee9105e60eb80cc2d558bb25dc5fc82e5aa00db4577c54c70d6a
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - 6868:6868/tcp
    volumes:
      - ${APPDATA_ROOT}/profilarr:/config
    environment:
      - TZ=${TZ}

  prowlarr:
    container_name: prowlarr
    restart: unless-stopped
    image: ghcr.io/home-operations/prowlarr:rolling@sha256:6152751c3ea2e7751564f5952173d5e83eed0e09f3fabd2cb6bdb58690c39e2f
    user: "${PUID}:${PGID}"
    ports:
      - 9696:9696/tcp
    volumes:
      - ${APPDATA_ROOT}/prowlarr:/config

    environment:
      - TZ=${TZ}

  radarr:
    container_name: radarr
    restart: unless-stopped
    image: ghcr.io/home-operations/radarr:rolling@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
    user: "${PUID}:${PGID}"
    ports:
      - 7878:7878/tcp
    volumes:
      - ${APPDATA_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
      - ${DOWNLOADS_ROOT}:/data/downloads

    environment:
      - TZ=${TZ}

  sonarr:
    container_name: sonarr
    restart: unless-stopped
    user: "${PUID}:${PGID}"

    image: ghcr.io/home-operations/sonarr:rolling@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
    ports:
      - 8989:8989/tcp
    volumes:
      - ${APPDATA_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
      - ${DOWNLOADS_ROOT}:/data/downloads
    environment:
      - TZ=${TZ}

  qui:
    container_name: qui
    image: ghcr.io/autobrr/qui:latest@sha256:1172ca40283330445d61189263a65a31ba703770a230b9e2a913f6e57bc2dd23
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - 7476:7476/tcp
    volumes:
      - ${APPDATA_ROOT}/qui:/config
      - ${DATA_ROOT}:/data
      - ${DOWNLOADS_ROOT}:/data/downloads
    environment:
      - TZ=${TZ}

  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:release@sha256:3b3093e955f7a40afc15dce6e2ebc44c7ffa99fe22b008b915eeed9cd0b1c658
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - 8080:8080/tcp
    volumes:
      - ${APPDATA_ROOT}/qbittorrent:/config
      - ${DOWNLOADS_ROOT}:/data/downloads
      - ${DATA_ROOT}/torrents:/data/torrents

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=protonvpn
      - VPN_LAN_NETWORK=${VPN_LAN_NETWORK:-192.168.1.0/24}
      - VPN_LAN_LEAK_ENABLED=false
      - PRIVOXY_ENABLED=false
