services:
  jellyfin:
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    group_add:
      - "44" #video group
      - "107" #render group
    devices:
      - /dev/dri:/dev/dri
    image: ghcr.io/jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    ports:
      - 1900:1900/udp
      - 7359:7359/udp
      - 8096:8096/tcp
      - 8920:8920/tcp
    environment:
      - JELLYFIN_DATA_DIR=/config/data
      - JELLYFIN_CONFIG_DIR=/config
      - JELLYFIN_LOG_DIR=/config/log
      - JELLYFIN_CACHE_DIR=/config/cache
      - TZ=${TZ}
    volumes:
      - ${APPDATA_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media


  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    user: "${PUID}:${PGID}"
    ports:
      - 5055:5055/tcp
    restart: unless-stopped

    volumes:
      - ${APPDATA_ROOT}/seerr:/app/config
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info

  profilarr:
    container_name: profilarr
    image: ghcr.io/santiagosayshey/profilarr:latest@sha256:5c7203b8af08ee9105e60eb80cc2d558bb25dc5fc82e5aa00db4577c54c70d6a
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - 6868:6868/tcp
    volumes:
      - ${APPDATA_ROOT}/profilarr:/config
    environment:
      - TZ=${TZ}

  prowlarr:
    container_name: prowlarr
    restart: unless-stopped
    image: ghcr.io/home-operations/prowlarr:rolling@sha256:0954599432e16ccd86129f1eb8eb0247fd0d1591aab400f73e2010a1cda37be8
    user: "${PUID}:${PGID}"
    ports:
      - 9696:9696/tcp
    volumes:
      - ${APPDATA_ROOT}/prowlarr:/config

    environment:
      - TZ=${TZ}

  radarr:
    container_name: radarr
    restart: unless-stopped
    image: ghcr.io/home-operations/radarr:rolling@sha256:ffe1f4d7c30b33a1e1256e14ace0eefddf120b37d8defceba208e9c190772f8d
    user: "${PUID}:${PGID}"
    ports:
      - 7878:7878/tcp
    volumes:
      - ${APPDATA_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
      - ${DOWNLOADS_ROOT}:/data/downloads

    environment:
      - TZ=${TZ}

  sonarr:
    container_name: sonarr
    restart: unless-stopped
    user: "${PUID}:${PGID}"

    image: ghcr.io/home-operations/sonarr:rolling@sha256:93b0923dd12afd43247739e19dac59d74c52a15ea12e036b7ced264cffb42574
    ports:
      - 8989:8989/tcp
    volumes:
      - ${APPDATA_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
      - ${DOWNLOADS_ROOT}:/data/downloads
    environment:
      - TZ=${TZ}

  qui:
    container_name: qui
    image: ghcr.io/autobrr/qui:latest@sha256:a5b2f5faf6388cce257137c88e4b189458fd799cf9119ed476c980e5a69341b2
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - 7476:7476/tcp
    volumes:
      - ${APPDATA_ROOT}/qui:/config
      - ${DATA_ROOT}:/data
      - ${DOWNLOADS_ROOT}:/data/downloads
    environment:
      - TZ=${TZ}

  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:release@sha256:bd7e2d02cb1b52941bfe50feef87fce7f02db82aea7ba71259d3e6312a2f8fc8
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - 8080:8080/tcp
    volumes:
      - ${APPDATA_ROOT}/qbittorrent:/config
      - ${DOWNLOADS_ROOT}:/data/downloads
      - ${DATA_ROOT}/torrents:/data/torrents

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=protonvpn
      - VPN_LAN_NETWORK=${VPN_LAN_NETWORK:-192.168.1.0/24}
      - VPN_LAN_LEAK_ENABLED=false
      - PRIVOXY_ENABLED=false
