volumes:
  doco-cd-data:

secrets:
  git_token:
    file: git_token.txt   # GitHub PAT (repo read scope) — never commit this
  op_token:
    file: op_token.txt    # 1Password service account token — never commit this

services:
  doco-cd:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:latest@sha256:b3dbc27d6cce437ad5acc34f326121623b5a3b2b45b85baf3029001e0f9fa764
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Dublin}
      LOG_LEVEL: info
      GIT_ACCESS_TOKEN_FILE: /run/secrets/git_token
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/op_token
      SECRET_PROVIDER_CACHE_ENABLED: true
      SECRET_PROVIDER_CACHE_TTL: 5m
      POLL_CONFIG: |
        - source: git
          url: https://github.com/girodav/home-server.git
          reference: main
          interval: 180
    secrets:
      - git_token
      - op_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doco-cd-data:/data
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
