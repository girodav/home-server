volumes:
  doco-cd-data:

secrets:
  op_token:
    file: op_token.txt    # 1Password service account token — never commit this

services:
  doco-cd:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:latest@sha256:0d67875f8caec4dfca3adf4b8fb7c12f865fc91c5e3b80da3397f1992012f38a
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Dublin}
      LOG_LEVEL: info
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/op_token
      SECRET_PROVIDER_CACHE_ENABLED: true
      SECRET_PROVIDER_CACHE_TTL: 5m
      POLL_CONFIG: |
        - source: git
          url: https://github.com/girodav/home-server.git
          reference: main
          interval: 180
    secrets:
      - op_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doco-cd-data:/data
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
