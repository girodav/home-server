services:
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    user: "1000"
    ports:
      - 3000:3000
    volumes:
      - /nvme/docker_appdata/monitoring/grafana:/var/lib/grafana
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    container_name: prometheus
    user: "1000"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - /nvme/docker_appdata/monitoring/prometheus:/prometheus
    ports:
      - 9090:9090
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    user: "1000"
    ports:
      - 9100:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
    restart: unless-stopped
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"  # Bind to localhost only
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true  # Required for container metrics
    security_opt:
      - no-new-privileges:true
networks:
  caddy:
    external: true
